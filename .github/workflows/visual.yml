name: Visual validation

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  visual:
    name: Visual validation (Playwright)
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write

    env:
      VISUAL_BASE_URL: http://localhost:5173

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Start LifeForge with Docker Compose
        run: |
          cp env/.env.docker.example env/.env.docker
          docker compose down -v --remove-orphans
          docker compose up --build -d
          for attempt in {1..60}; do
            if curl --fail --silent http://localhost:5173/ >/dev/null; then
              break
            fi
            if [ "$attempt" -eq 60 ]; then
              echo 'LifeForge did not become reachable on http://localhost:5173'
              docker compose ps
              docker compose logs
              exit 1
            fi
            sleep 2
          done
          echo 'LifeForge client is running on port 5173.'
          echo 'LifeForge API is running on port 3636; PocketBase is running on port 8090.'

      - name: Seed visual-validation test user
        run: |
          # Create the test user directly via PocketBase so the visual test
          # can log in without relying on the first-user registration UI.
          # The login route verifies auth_password_hash (argon2), so we must
          # compute that hash and include it in the record.
          PB_URL="http://localhost:8090"
          PB_EMAIL="${PB_EMAIL:-admin@example.com}"
          PB_PASSWORD="${PB_PASSWORD:-changeme-at-least-8-chars}"
          VU_EMAIL="visual-validation@example.com"
          VU_PASSWORD="visual-validation-password"
          VU_USERNAME="visualvalidation"
          VU_NAME="Visual Validation"

          # Compute argon2 hash of the password
          HASH=$(node -e "
            const { hash } = require('argon2');
            hash(process.argv[1], { type: 2 }).then(h => process.stdout.write(h));
          " "$VU_PASSWORD")

          # Authenticate as superuser
          TOKEN=$(curl -sf -X POST "$PB_URL/api/collections/_superusers/auth-with-password" \
            -H 'Content-Type: application/json' \
            -d "{\"identity\":\"$PB_EMAIL\",\"password\":\"$PB_PASSWORD\"}" \
            | python3 -c 'import sys,json; print(json.load(sys.stdin)["token"])')

          if [ -z "$TOKEN" ]; then
            echo 'Failed to authenticate as PocketBase superuser; skipping seed.'
            exit 0
          fi

          # Check if user already exists
          EXISTING=$(curl -sf "$PB_URL/api/collections/users/records?filter=(email='$VU_EMAIL')" \
            -H "Authorization: $TOKEN" \
            | python3 -c 'import sys,json; print(json.load(sys.stdin)["totalItems"])')

          if [ "$EXISTING" = '0' ]; then
            curl -sf -X POST "$PB_URL/api/collections/users/records" \
              -H 'Content-Type: application/json' \
              -H "Authorization: $TOKEN" \
              -d "{
                \"email\": \"$VU_EMAIL\",
                \"username\": \"$VU_USERNAME\",
                \"name\": \"$VU_NAME\",
                \"verified\": true,
                \"password\": \"$VU_PASSWORD\",
                \"passwordConfirm\": \"$VU_PASSWORD\",
                \"auth_password_hash\": \"$HASH\",
                \"theme\": \"system\",
                \"language\": \"en\",
                \"fontScale\": 1.0,
                \"borderRadiusMultiplier\": 1.0
              }"
            echo "Seeded visual-validation user ($VU_EMAIL)."
          else
            echo "Visual-validation user ($VU_EMAIL) already exists; skipping seed."
          fi

      - name: Run visual suite
        id: visual
        run: pnpm exec playwright test

      - name: Upload Playwright report
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: visual-report
          path: visual-report
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload screenshots
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: visual-screenshots
          path: visual-results/screenshots
          if-no-files-found: ignore
          retention-days: 7

      - name: Publish screenshots to evidence branch
        if: always() && github.event.pull_request.head.repo.full_name == github.repository
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          SCREENSHOTS: ${{ github.workspace }}/visual-results/screenshots
          EVIDENCE_BRANCH: visual-validation/artifacts
        run: |
          set -euo pipefail
          if ! compgen -G "$SCREENSHOTS/*.png" >/dev/null; then
            echo 'No screenshots were produced; skipping evidence branch publication.'
            exit 0
          fi

          pages_dir="$(mktemp -d)"
          if ! git clone --quiet --depth 1 --branch "$EVIDENCE_BRANCH" \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            "$pages_dir" 2>/dev/null; then
            git clone --quiet --depth 1 \
              "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
              "$pages_dir"
            cd "$pages_dir"
            git checkout --quiet -B "$EVIDENCE_BRANCH"
          else
            cd "$pages_dir"
          fi

          find . -maxdepth 1 -type f -name '*.png' -delete
          cp "$SCREENSHOTS"/*.png .
          git add -A
          git -c user.name='github-actions[bot]' \
            -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit --quiet -m "visual validation screenshots (run ${GITHUB_RUN_ID})" || true
          git push --quiet --force origin "HEAD:${EVIDENCE_BRANCH}"

      - name: Comment visual evidence on the pull request
        if: always() && github.event.pull_request.head.repo.full_name == github.repository
        continue-on-error: true
        uses: actions/github-script@v7
        env:
          VISUAL_RESULT: ${{ steps.visual.outcome }}
          EVIDENCE_BRANCH: visual-validation/artifacts
        with:
          script: |
            const marker = '<!-- lifeforge-visual-validation -->';
            const { owner, repo, number } = context.issue;
            const status = process.env.VISUAL_RESULT === 'success'
              ? '✅ Passed'
              : `❌ Failed (${process.env.VISUAL_RESULT})`;
            const raw = `https://raw.githubusercontent.com/${owner}/${repo}/${process.env.EVIDENCE_BRANCH}`;
            const run = `https://github.com/${owner}/${repo}/actions/runs/${context.runId}`;
            const body = [
              marker,
              '## Visual validation (Playwright)',
              '',
              `**Status:** ${status}`,
              '',
              'The job starts LifeForge with Docker Compose: client **http://localhost:5173**, API **http://localhost:3636**, and PocketBase **http://localhost:8090**. Browser output includes non-2xx host responses and page errors unchanged.',
              '',
              `Screenshots: [workflow artifacts](${run}#artifacts) · [workflow run](${run})`,
              '',
              '| Evidence | Screenshot |',
              '| --- | --- |',
              `| Dark task list: painted row and checkbox on the left | ![dark task list](${raw}/01-task-list-dark.png) |`,
              `| Dark module sidebar | ![dark sidebar](${raw}/02-sidebar-dark.png) |`,
              `| Light task list: painted row and checkbox on the left | ![light task list](${raw}/03-task-list-light.png) |`,
              `| Light module sidebar | ![light sidebar](${raw}/04-sidebar-light.png) |`,
              `| Dark edit drawer with corrected Include Time field | ![dark edit drawer](${raw}/05-task-edit-drawer-dark.png) |`,
              `| Light edit drawer with corrected Include Time field | ![light edit drawer](${raw}/06-task-edit-drawer-light.png) |`
            ].join('\n');

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number: number,
              per_page: 100,
            });
            const existing = comments.find(comment => comment.body?.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: number,
                body,
              });
            }

      - name: Capture LifeForge container logs
        if: always()
        continue-on-error: true
        run: docker compose logs --no-color

      - name: Stop LifeForge
        if: always()
        continue-on-error: true
        run: docker compose down -v
