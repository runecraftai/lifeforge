# LifeForge – local development compose
# Ports are offset to avoid collisions with a running local instance:
#   PocketBase :18090  (production :8090)
#   API server :13636  (production :3636)
#   Web client :15173  (production :5173)
#
# Usage:
#   cp env/.env.docker.example env/.env.docker   # edit credentials
#   docker compose up --build
#   docker compose down -v                         # tear down + volumes
#
# To use the real ports (8090 / 3636 / 5173) you must stop any
# manually-started PocketBase / API / dev-server first — that is
# the commander's decision, not an automated step.

services:
  # ── PocketBase database ──────────────────────────────────────────────
  db:
    build:
      context: .
      dockerfile: docker/pocketbase/Dockerfile
    container_name: lifeforge-db
    restart: unless-stopped
    env_file:
      - ./env/.env.docker
    environment:
      - PB_DIR=/pb_data
    ports:
      - '${PB_PORT:-18090}:8090'
    volumes:
      - pb_data:/pb_data

  # ── One-shot migration runner ────────────────────────────────────────
  db-init:
    build:
      context: .
      dockerfile: docker/db-init/Dockerfile
    container_name: lifeforge-db-init
    env_file:
      - ./env/.env.docker
    environment:
      - DOCKER_MODE=true
      - PB_HOST=http://localhost:8090
      - PB_DIR=/pb_data
    volumes:
      - pb_data:/pb_data
      - ./modules:/app/modules
    depends_on:
      db:
        condition: service_healthy
    # exits after migrations are applied

  # ── API server ───────────────────────────────────────────────────────
  server:
    build:
      context: .
      dockerfile: docker/server/Dockerfile
    container_name: lifeforge-server
    restart: unless-stopped
    env_file:
      - ./env/.env.docker
    environment:
      - NODE_ENV=production
      - PB_HOST=http://db:8090
      - PORT=3636
    ports:
      - '${API_PORT:-13636}:3636'
    volumes:
      - ./modules:/lifeforge/modules
      - ./locales:/lifeforge/locales
    depends_on:
      db:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully

  # ── Web client (nginx SPA) ───────────────────────────────────────────
  client:
    build:
      context: .
      dockerfile: docker/client/Dockerfile
      args:
        - VITE_API_HOST=/api
    container_name: lifeforge-client
    restart: unless-stopped
    ports:
      - '${WEB_PORT:-15173}:80'
    depends_on:
      server:
        condition: service_healthy

volumes:
  pb_data:
    name: lifeforge-pb-data
